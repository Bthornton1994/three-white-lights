# merge-gate.yml — mechanical PR gate. Not a GDD §12.2 bar.
# A green run does not grade Empire, Career, art, or any critic piece.
# It answers: does it compile, do the node tests pass, did a new advisory appear.

name: merge-gate

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Node test suite
        run: npm test

      - name: Supply-chain remainder
        run: |
          node .github/scripts/audit-gate.mjs --self-test
          node .github/scripts/audit-gate.mjs
