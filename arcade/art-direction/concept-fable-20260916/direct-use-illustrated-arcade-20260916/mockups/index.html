<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fable Direct-Use Illustrated Arcade — composition mockups</title>
<!--
  MOCKUP · CONCEPT ONLY · DO_NOT_MERGE · not production code · not visual approval.

  Every image on this page is one of the five stamped files in ../../reference-ai/, loaded byte-for-byte.
  Nothing is cropped, resampled, recoloured or re-saved ON DISK. A "camera" (cam) maps a source region of
  the file onto a viewport box with one uniform scale and a translation, and clips to the region, so the red
  stamp banner (rows 0..33) and the hallucinated title copy ("PRESS START", "© 1994 IRONWROUGHT GAMES",
  rows >= 645) can never render. What the browser paints IS resampled at every non-integer scale (bilinear)
  and is tinted by the overlays; the screenshots are therefore derivatives of the concept for evidence only,
  and carry a visible MOCKUP label.

  Query: ?screen=title|lift|results|timing&lift=squat|bench|deadlift&effort=light|max&p=0.42&cam=load|lifter&bomb=1
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
  :root {
    --iron: #14110f; --iron-2: #1c1612; --iron-3: #2a221c; --ink: #f4efe4; --muted: #b7aa98;
    --amber: #d4892a; --amber-2: #f3c56a; --paper: #f3e6c8; --paper-ink: #1a1510;
    --red: #b83228; --white-light: #f7f3ea; --border: rgb(244 239 228 / 0.14);
    --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --serif: "Source Serif 4", "Palatino Linotype", Palatino, serif;
  }
  html, body { margin: 0; height: 100%; background: var(--iron); color: var(--ink); font-family: var(--body); }
  .screen { position: relative; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .mock-label { position: fixed; top: 6px; right: 8px; z-index: 9; font: 600 10px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase;
    color: #ffd9d9; background: rgb(139 26 26 / 0.85); padding: 5px 7px; border-radius: 4px; pointer-events: none; }

  /* ---- camera: a box that shows one source region of an untouched file ---- */
  .cam { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .cam.box { position: relative; inset: auto; }              /* a fixed picture box (desktop timing) */
  .cam img { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; image-rendering: auto; }
  .cam.integer img { image-rendering: pixelated; }
  .cam.fill { background: #0d0b0a; }
  .cam.ambient img { filter: brightness(0.35) saturate(0.8); }

  /* ---- lighting overlays (composition, not pixels); attached to the picture box ---- */
  .veil { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgb(20 17 15 / 0.15) 0%, rgb(20 17 15 / 0.3) 45%, rgb(20 17 15 / 0.94) 100%); }
  .spot { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: var(--spot, 0.5);
    background: radial-gradient(ellipse 55% 70% at 50% 0%, rgb(243 197 106 / 0.55), rgb(243 197 106 / 0.12) 45%, transparent 70%); }
  .strain { position: absolute; inset: 0; pointer-events: none; opacity: var(--strain, 0);
    background: radial-gradient(ellipse 70% 70% at 50% 55%, transparent 40%, rgb(184 50 40 / 0.55) 100%); }
  .lights { display: flex; gap: 10px; justify-content: center; }
  .light { width: 18px; height: 18px; border-radius: 999px; background: #2a221c; box-shadow: inset 0 0 0 1px rgb(244 239 228 / 0.18); }
  .light.white { background: var(--white-light); box-shadow: 0 0 16px rgb(247 243 234 / 0.7); }
  .light.red { background: var(--red); box-shadow: 0 0 14px rgb(184 50 40 / 0.55); }
  .stage-lights { position: absolute; top: 16px; left: 0; right: 0; z-index: 2; }

  /* ---- runtime chrome, copied from arcade/src/styles.css so the mock reads like the app ---- */
  .panel, .title-copy { position: relative; z-index: 1; margin-top: auto; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px;
    background: linear-gradient(180deg, transparent, rgb(20 17 15 / 0.9) 22%, var(--iron) 60%); }
  .kicker { margin: 0; letter-spacing: 0.22em; font-family: var(--display); font-size: 0.78rem; font-weight: 600; color: var(--amber); text-transform: uppercase; }
  h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: 0.02em; line-height: 0.95; margin: 0; }
  h1 { font-size: clamp(2.4rem, 10vw, 3.6rem); } h2 { font-size: clamp(1.7rem, 6vw, 2.2rem); }
  .lede, .hint { margin: 0; color: var(--muted); line-height: 1.45; } .hint { font-size: 0.92rem; }
  .btn { appearance: none; border: 1px solid var(--border); background: var(--iron-3); color: var(--ink); font-family: var(--display); font-size: 1.15rem; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; min-height: 48px; border-radius: 14px; padding: 0 18px; }
  .btn-primary { background: var(--ink); color: var(--iron); border-color: var(--ink); } .btn-ghost { background: transparent; }
  .hud { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.95rem; }
  .hud strong { font-variant-numeric: tabular-nums; font-size: 1.35rem; }
  .lane { position: relative; height: 18px; border-radius: 999px; background: #2a221c; overflow: hidden; border: 1px solid var(--border); }
  .lane-window { position: absolute; top: 0; bottom: 0; background: rgb(212 137 42 / 0.55); }
  .lane-needle { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); border-radius: 2px; }
  .stage { position: relative; flex: 1; min-height: 240px; overflow: hidden; background: #0d0b0a; display: flex; align-items: center; justify-content: center; }

  /* lift select */
  .lift-grid { display: grid; gap: 12px; }
  .lift-card { display: grid; grid-template-columns: 124px 1fr; gap: 12px; align-items: center; text-align: left; background: rgb(28 22 18 / 0.92); border: 1px solid var(--border); border-radius: 16px; padding: 8px; color: inherit; }
  .lift-card .tile { position: relative; width: 124px; height: 124px; border-radius: 10px; overflow: hidden; background: #120f0c; }
  .lift-card b { display: block; font-family: var(--display); font-size: 1.28rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .lift-card span { color: var(--muted); font-size: 0.86rem; }
  .lift-card small { display: block; margin-top: 4px; font-family: var(--display); letter-spacing: 0.14em; font-size: 0.68rem; color: var(--amber); text-transform: uppercase; }

  /* results */
  .results-head { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
  .results-head .face { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; background: #120f0c; border: 1px solid var(--border); }
  .score-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .score-row div { background: var(--iron-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .score-row span { display: block; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .score-row b { font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .results-sheet { background: var(--paper); color: var(--paper-ink); border-radius: 8px; padding: 16px; box-shadow: 0 24px 48px rgb(0 0 0 / 0.35); font-family: var(--serif); }
  .results-sheet header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--paper-ink); padding-bottom: 8px; margin-bottom: 10px; }
  .results-sheet .fed { font-family: var(--display); letter-spacing: 0.16em; font-size: 0.78rem; }
  .results-grid { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; font-size: 0.95rem; }
  .results-grid .total { grid-column: 1 / -1; display: flex; justify-content: space-between; border-top: 1px solid rgb(26 21 16 / 0.25); margin-top: 8px; padding-top: 8px; font-weight: 600; font-size: 1.15rem; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  @media (min-width: 860px) {
    .lift-grid { grid-template-columns: repeat(3, 1fr); }
    .lift-card { grid-template-columns: 1fr; text-align: center; padding: 10px; }
    .lift-card .tile { width: 100%; height: 240px; }
    .panel, .title-copy { max-width: 720px; margin-inline: auto; width: 100%; box-sizing: border-box; }
    .screen.timing { flex-direction: row; }
    .timing .stage { flex: 0 0 720px; height: 100vh; }
    .timing .panel { flex: 1; max-width: none; margin: auto 0; padding: 32px 40px; background: var(--iron); justify-content: center; gap: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .cam img { transition: none !important; } }
</style>
</head>
<body>
<div class="mock-label">Mockup · not production art · concept files unaltered on disk</div>
<div id="root"></div>
<script>
// ---------- assets: the stamped files, untouched. Coordinates are file coordinates (banner included). ----------
const A = '../../reference-ai/';
const FILES = {
  title:    { src: A + 'AI-REF-05-TITLE-SCREEN.png',               w: 1280, h: 754 },
  squat:    { src: A + 'AI-REF-04-SQUAT-HOLE-LIGHT-VS-MAX.png',     w: 1280, h: 754 },
  deadlift: { src: A + 'AI-REF-03-DEADLIFT-SETUP-LOCKOUT-MAX.png',  w: 1280, h: 754 },
  bench:    { src: A + 'AI-REF-02-BENCH-THREE-QUARTER.png',         w: 1024, h: 1058 },
  model:    { src: A + 'AI-REF-01-MODEL-SHEET.png',                 w: 1280, h: 754 },
};
// Source regions [x, y, w, h]. Every y >= 34 (banner excluded); title regions end at row 640 (hallucinated copy starts ~650).
const R = {
  titleWide:      [0, 34, 1280, 606],
  titleTall:      [400, 288, 480, 352],
  // squat panels: "wide" = whole panel; "load" = full bar span, top/bottom trimmed (plates always in frame); "lifter" = tight hold (plates cropped)
  squatLightWide: [0, 34, 636, 720],   squatLightLoad: [10, 150, 616, 500],  squatLightLifter: [110, 130, 420, 540],
  squatMaxWide:   [644, 34, 636, 720], squatMaxLoad:   [644, 140, 636, 510], squatMaxLifter:   [745, 120, 430, 550],
  dlSetupWide:    [0, 34, 636, 720],   dlSetupLoad:    [0, 170, 636, 480],   dlSetupLifter:    [40, 150, 560, 520],
  dlLockWide:     [644, 34, 636, 720], dlLockLoad:     [644, 40, 636, 690],  dlLockLifter:     [700, 40, 540, 660],
  benchWide:      [0, 34, 1024, 1024], benchLoad:      [20, 150, 990, 800],  benchLifter:      [120, 180, 800, 700],
  cardSquat:      [150, 190, 330, 330], cardBench: [240, 230, 470, 470], cardDeadlift: [800, 70, 400, 400],
  faceGrin: [1032, 486, 150, 108], faceSlack: [1032, 596, 150, 108], faceExhale: [1032, 376, 150, 108],
};
const ASSERT = Object.values(R).every(([x, y, w, h]) => y >= 34 && x >= 0);
const TITLE_OK = [R.titleWide, R.titleTall].every(([, y, , h]) => y + h <= 640);
if (!ASSERT || !TITLE_OK) throw new Error('region table violates banner/copy bounds');

// ---------- camera: map a source region onto a box (cover or contain); integer scales get nearest-neighbour ----------
function cam(file, region, opts = {}) {
  const fit = opts.fit || 'cover';
  const el = document.createElement('div'); el.className = 'cam' + (opts.cls ? ' ' + opts.cls : '');
  const img = new Image(); img.src = file.src; img.width = file.w; img.height = file.h; el.appendChild(img);
  el.setRegion = (r) => { el.__region = r; el.__place && el.__place(); };
  el.__region = region;
  el.__place = () => {
    const W = el.clientWidth, H = el.clientHeight; const [x, y, w, h] = el.__region;
    let k = fit === 'cover' ? Math.max(W / w, H / h) : Math.min(W / w, H / h);
    if (opts.maxScale) k = Math.min(k, opts.maxScale);
    if (opts.snap && Math.abs(k - Math.round(k)) < 0.02) k = Math.round(k);
    el.classList.toggle('integer', Number.isInteger(k));
    const ox = (W - w * k) / 2 - x * k, oy = (opts.anchorTop ? 0 : (H - h * k) / 2) - y * k;
    img.style.transform = `translate(${ox}px, ${oy}px) scale(${k})`;
    img.style.clipPath = `inset(${y}px ${file.w - x - w}px ${file.h - y - h}px ${x}px)`;   // image space, pre-transform
    el.dataset.scale = k.toFixed(3);
  };
  return el;
}
function lerpRegion(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }
const clamp01 = v => Math.max(0, Math.min(1, v));

// ---------- screens ----------
const q = new URLSearchParams(location.search);
const screen = q.get('screen') || 'timing', lift = q.get('lift') || 'squat', effort = q.get('effort') || 'light';
const camPolicy = q.get('cam') || 'load';
const p = parseFloat(q.get('p') || '0.42'), wide = innerWidth >= 860;
const root = document.getElementById('root');
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const lightsRow = (arr, cls) => { const d = h('div', 'lights' + (cls ? ' ' + cls : '')); arr.forEach(c => d.appendChild(h('span', 'light ' + c))); return d; };
const placers = [];
function ambientTitle(section) {  // decorative backdrop: the title file's art at <= 1.25x, dimmed, never the strain face
  const c = wide ? cam(FILES.title, R.titleWide, { fit: 'cover', maxScale: 1.0, anchorTop: true, cls: 'ambient fill' })
                 : cam(FILES.title, R.titleTall, { fit: 'cover', maxScale: 1.25, anchorTop: true, cls: 'ambient fill' });
  section.appendChild(c); placers.push(c); section.appendChild(h('div', 'veil'));
}

if (screen === 'title') {
  const s = h('section', 'screen title');
  const c = wide ? cam(FILES.title, R.titleWide, { fit: 'contain', maxScale: 1, anchorTop: true, cls: 'fill' })
                 : cam(FILES.title, R.titleTall, { fit: 'cover', maxScale: 1.25, anchorTop: true, cls: 'fill' });
  s.appendChild(c); placers.push(c);
  const spot = h('div', 'spot'); spot.style.setProperty('--spot', '0.35'); s.appendChild(spot);
  s.appendChild(h('div', 'veil'));
  const copy = h('div', 'title-copy');
  if (!wide) { copy.appendChild(h('p', 'kicker', 'Iron &amp; Amber Arcade')); copy.appendChild(h('h1', null, 'Three White Lights')); }
  copy.appendChild(h('p', 'lede', 'One lift. Three attempts. Timing is the sport. Fatigue stays hidden and shows up in bar speed.'));
  copy.appendChild(lightsRow(['white', 'white', 'white']));
  copy.appendChild(h('button', 'btn btn-primary', 'Step onto the platform'));
  s.appendChild(copy); root.appendChild(s);
}

if (screen === 'lift') {
  const s = h('section', 'screen lift'); ambientTitle(s);
  const panel = h('div', 'panel');
  panel.appendChild(h('p', 'kicker', 'Iron &amp; Amber Arcade')); panel.appendChild(h('h2', null, 'Choose a lift'));
  panel.appendChild(h('p', 'hint', 'Each lift has its own timing. Fatigue stays hidden.'));
  const grid = h('div', 'lift-grid');
  [['squat', FILES.squat, R.cardSquat, 'Squat', 'Depth in the hole, then drive.', 'Depth · Drive'],
   ['bench', FILES.bench, R.cardBench, 'Bench', 'Pause on the chest, then press.', 'Pause · Press'],
   ['deadlift', FILES.deadlift, R.cardDeadlift, 'Deadlift', 'Break the floor, lock the hips.', 'Pull · Lockout']]
  .forEach(([id, file, region, name, cue, checks]) => {
    const card = h('button', 'lift-card'); const tile = h('div', 'tile');
    const c = cam(file, region, { fit: 'cover' }); tile.appendChild(c); placers.push(c);
    card.appendChild(tile); card.appendChild(h('span', null, `<b>${name}</b>${cue}<small>${checks}</small>`)); grid.appendChild(card);
  });
  panel.appendChild(grid); s.appendChild(panel); root.appendChild(s);
}

if (screen === 'results') {
  const bombed = q.get('bomb') === '1';
  const s = h('section', 'screen results'); ambientTitle(s);
  const panel = h('div', 'panel');
  // Face stamp sits in the app chrome, NOT on the federation sheet (the sheet stays a plain results sheet for the §12.2 "would a lifter believe it" bar).
  const head = h('div', 'results-head'); const face = h('div', 'face');
  const fc = cam(FILES.model, bombed ? R.faceSlack : R.faceGrin, { fit: 'cover' }); face.appendChild(fc); placers.push(fc);
  const titleBlock = h('div'); titleBlock.appendChild(h('p', 'kicker', 'Iron &amp; Amber Arcade')); titleBlock.appendChild(h('h2', null, bombed ? 'No total' : 'Three white lights'));
  head.appendChild(face); head.appendChild(titleBlock); panel.appendChild(head);
  const row = h('div', 'score-row'); [['Weight', '1725'], ['Execution', '720'], ['Streak', '50'], ['Total', '2495']].forEach(([k, v]) => row.appendChild(h('div', null, `<span>${k}</span><b>${v}</b>`)));
  panel.appendChild(row);
  const sheet = h('article', 'results-sheet'); const sh = h('header'); sh.appendChild(h('span', 'fed', 'Iron &amp; Amber Arcade')); sh.appendChild(h('span', null, 'Arcade Open')); sheet.appendChild(sh);
  const g = h('div', 'results-grid');
  [['Lifter', 'A. LIFTER'], ['Bodyweight', '83.0 kg'], ['Lift', 'Squat'], ['A1', '162.5 ○ ○ ○ · RPE 7.0'], ['A2', '172.5 ○ ○ ○ · RPE 8.5'], ['A3', '180.0 x ● ● ● · RPE 10.0'], ['Best', '172.5 kg'], ['DOTS', '116.45'], ['Implied e1RM', '172.5 kg']]
    .forEach(([k, v]) => { g.appendChild(h('span', null, k)); g.appendChild(h('strong', null, v)); });
  g.appendChild(h('div', 'total', '<span>Total</span><span>172.5 kg</span>')); sheet.appendChild(g); panel.appendChild(sheet);
  const st = h('div', 'stack'); st.appendChild(h('button', 'btn btn-primary', 'Share card')); st.appendChild(h('button', 'btn btn-ghost', 'Another lift')); panel.appendChild(st);
  s.appendChild(panel); root.appendChild(s);
}

if (screen === 'timing') {
  // Cues copied from arcade/src/loop/timing.ts + feel.ts (fatigue 0). The camera's arrival at the hold is pinned to the cue centre,
  // so a fatigue-stretched easing in a build could change the approach curve but never where the hold lands relative to the graded band.
  const cues = { squat: [['DEPTH', 0.42, 340], ['DRIVE', 0.78, 360]], bench: [['PAUSE', 0.40, 320], ['PRESS', 0.76, 340]], deadlift: [['PULL', 0.28, 340], ['LOCKOUT', 0.80, 380]] }[lift];
  const durationMs = { squat: 2220, bench: 1930, deadlift: 1920 }[lift];
  const c1 = cues[0][1], c2 = cues[1][1];
  const hud = { squat: { light: '162.5', max: '180.0' }, bench: { light: '110.0', max: '120.0' }, deadlift: { light: '180.0', max: '200.0' } }[lift][effort];  // consistent with visualEffort() at e1RM 180/120/200
  const s = h('section', 'screen timing');
  const stage = h('div', 'stage');
  const holdKey = camPolicy === 'lifter' ? 'Lifter' : 'Load';
  let file, wideR, holdR, region;
  if (lift === 'squat') {
    file = FILES.squat; wideR = effort === 'max' ? R.squatMaxWide : R.squatLightWide; holdR = R[(effort === 'max' ? 'squatMax' : 'squatLight') + holdKey];
    const t = p < c1 ? p / c1 : p < 0.58 ? 1 : 1 - (p - 0.58) / (1 - 0.58); region = lerpRegion(wideR, holdR, clamp01(t));
  } else if (lift === 'bench') {
    file = FILES.bench; wideR = R.benchWide; holdR = R['bench' + holdKey];
    const t = p < c1 ? p / c1 : p < 0.55 ? 1 : 1 - (p - 0.55) / (1 - 0.55); region = lerpRegion(wideR, holdR, clamp01(t));
  } else {
    file = FILES.deadlift; const locked = p >= c2;
    wideR = locked ? R.dlLockWide : R.dlSetupWide; holdR = locked ? R['dlLock' + holdKey] : R['dlSetup' + holdKey];
    region = locked ? holdR : lerpRegion(R.dlSetupWide, R['dlSetup' + holdKey], clamp01(p / c1));   // hard cut at the LOCKOUT cue
  }
  // Desktop: a fixed picture box = the wide region at 1x; the hold is a 1.06x push-in inside the same box (cover), so the frame never contracts.
  // Phone: the stage is the box; policy 'load' contains the full bar span (plates always in frame), policy 'lifter' covers at <= 1.15x (plates cropped).
  let box;
  if (wide) {
    box = cam(file, region, { fit: 'cover', maxScale: 1.06, snap: true, cls: 'box fill' });
    box.style.width = `${Math.min(wideR[2], 720)}px`; box.style.height = `${Math.min(wideR[3], 800)}px`;
  } else {
    box = cam(file, region, camPolicy === 'lifter' ? { fit: 'cover', maxScale: 1.15, snap: true, cls: 'fill' } : { fit: 'contain', maxScale: 1.0, snap: true, cls: 'fill' });
  }
  stage.appendChild(box); placers.push(box);
  // Lighting attached to the picture box: spotlight brightens toward the hold; strain vignette only on max, rising with progress.
  const spot = h('div', 'spot'); spot.style.setProperty('--spot', (0.35 + 0.35 * clamp01(p / c1)).toFixed(2)); box.appendChild(spot);
  const strain = h('div', 'strain'); strain.style.setProperty('--strain', effort === 'max' ? (0.25 + 0.5 * p).toFixed(2) : '0'); box.appendChild(strain);
  if (effort === 'max' && p > c1 && p < 0.9) box.style.transform = `translate(${(Math.sin(p * 97) * 2).toFixed(1)}px, ${(Math.cos(p * 61) * 1.5).toFixed(1)}px)`;
  stage.appendChild(lightsRow(['off', 'off', 'off'], 'stage-lights'));
  s.appendChild(stage);
  const panel = h('div', 'panel');
  panel.appendChild(h('div', 'hud', `<span>${lift} · attempt ${effort === 'max' ? 3 : 1}</span><strong>${hud} kg</strong>`));
  const lane = h('div', 'lane');
  const halfOf = winMs => (winMs / durationMs / 2) * 0.88;   // laneWindowPercent(): visible band = graded good zone
  cues.forEach(([label, center, winMs]) => { const half = halfOf(winMs); const wnd = h('span', 'lane-window'); wnd.style.left = `${(center - half) * 100}%`; wnd.style.width = `${half * 2 * 100}%`; lane.appendChild(wnd); });
  const needle = h('span', 'lane-needle'); needle.style.left = `${Math.min(100, p * 100)}%`; lane.appendChild(needle); panel.appendChild(lane);
  const next = cues.find(([, c, w]) => p <= c + halfOf(w)) || null;
  panel.appendChild(h('button', 'btn btn-primary', next ? next[0] : 'HOLD'));
  panel.appendChild(h('p', 'hint', 'Tap in the amber window. Fatigue is not a bar — it shrinks that window.'));
  s.appendChild(panel); root.appendChild(s);
}

function placeAll() { placers.forEach(c => c.__place()); }
window.addEventListener('resize', placeAll);
Promise.all([...document.images].map(i => i.complete ? null : new Promise(r => { i.onload = r; i.onerror = r; }))).then(() => { placeAll(); document.body.dataset.ready = '1'; });
placeAll();
</script>
</body>
</html>
